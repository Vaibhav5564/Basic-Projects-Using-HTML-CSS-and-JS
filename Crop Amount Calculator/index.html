<!DOCTYPE html >
    <html lang="en">

        <head>
            <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Crop Amount Calculator</title>
                    <link rel="stylesheet" href="style.css">
                    </head>

                    <body>

                        <div class="container">

                            <h1>🌾 </h1>

                            <div class="rate-box">

                                <input type="number" id="rate" placeholder="Enter  Rate">
                                    <button onclick="setRate()">Save Rate</button>
                            </div>

                            <div id="calculator" style="display:none;">


                                <label>Length</label>
                                <input type="number" id="length" placeholder="Enter Length">

                                    <label>Breadth</label>
                                    <input type="number" id="breadth" placeholder="Enter Breadth">

                                        <button onclick="calculate()">Calculate</button>

                                        <div class="result">
                                            <h2>Result</h2>

                                            <h3>Total Amount : <span id="rAmount">-</span></h3>
                                        </div>
                                    </div>

                            </div>

                            <script src="script.js"></script>

                    </body>

                </html>
